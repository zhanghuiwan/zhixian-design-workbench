<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="知闲 App 的页面、组件、颜色与图层。以 2026-11-12 Figma 导出为基础的本地可维护设计工作台。"><title>知闲 · App 设计工作台</title><link rel="icon" href="assets/app/app-icon-book-light.png"><link rel="stylesheet" href="workbench.css"></head>
<body>
<a class="skip-link" href="#workspace">跳至设计画布</a>
<header class="app-header"><button id="menu-toggle" class="icon-button" aria-label="显示或隐藏页面目录"></button><a class="brand" href="#pages"><img src="assets/app/app-icon-book-light.png" alt="" width="30" height="30"><span>知闲 <small>设计工作台</small></span></a><span class="header-divider"></span><span class="source-label"><i></i>Figma 本地快照 <span>11.12</span></span><div class="header-actions"><span id="save-status" role="status">载入设计…</span><button id="undo" class="icon-button" aria-label="撤销" disabled></button><button id="redo" class="icon-button" aria-label="重做" disabled></button><button id="export" class="button">导出</button><button id="save" class="button primary">保存到项目</button></div></header>
<div class="app-layout"><aside id="sidebar" class="sidebar"><div class="project-title"><span>APP DESIGN</span><strong>知闲 Android</strong><small id="inventory-count"></small></div><nav class="view-nav" aria-label="设计内容"><a href="#pages" data-view="pages"></a><a href="#components" data-view="components"></a><a href="#tokens" data-view="tokens"></a><a href="#assets" data-view="assets"></a><a href="#handoff" data-view="handoff"></a><a href="#review" data-view="review" class="review-nav-link"></a></nav><div class="sidebar-heading"><span id="directory-title">页面目录</span><button id="show-all" class="plain-button">全部</button></div><label class="search-box"><span id="search-icon"></span><input type="search" id="search" placeholder="搜索页面、文字或图层" aria-label="搜索页面、文字或图层"></label><div id="directory" class="directory"></div><footer class="sidebar-footer"><span class="source-dot"></span><span>本地文件 · 无需 Figma MCP</span><button id="import" class="plain-button">导入 JSON</button></footer></aside>
<main id="workspace" tabindex="-1"><div class="workspace-toolbar"><div><div class="breadcrumbs" id="breadcrumbs">知闲 Android / 页面</div><h1 id="view-title">页面</h1></div><div class="canvas-controls"><button id="overview" class="button" hidden>全部页面</button><label id="theme-filter-label" class="control-label">主题<select id="theme-filter" aria-label="筛选原稿主题"><option value="all">全部</option><option value="light">浅色</option><option value="dark">深色</option><option value="proposal">提案</option></select></label><label id="zoom-label" class="control-label">缩放<select id="zoom" aria-label="画布缩放"><option value="0.5">50%</option><option value="0.65" selected>65%</option><option value="0.8">80%</option><option value="1">100%</option><option value="1.25">125%</option></select></label></div></div><div id="canvas" class="canvas" aria-label="设计内容"></div></main>
<aside id="inspector" class="inspector"><div class="inspector-tabs"><button class="active" id="properties-tab" aria-pressed="true">设计</button><button id="layers-tab" aria-pressed="false">图层</button></div><div id="properties" class="inspector-body"></div><div id="layers" class="inspector-body" hidden></div></aside></div>
<div id="toast" class="toast" role="status" hidden></div><dialog id="export-dialog"><form method="dialog"><div class="dialog-heading"><h2>保存与交接</h2><button class="icon-button close-dialog" aria-label="关闭">×</button></div></form><p>将当前修改带到下一次设计或 App 开发中。</p><div class="export-actions"><button id="export-json" class="button primary">下载完整设计 JSON</button><button id="export-html" class="button">下载独立 HTML</button><button id="export-css" class="button">下载颜色 CSS</button><button id="export-spec" class="button">下载开发说明 Markdown</button></div><p class="hint">“保存到项目”会更新本地 design.json。下载文件不会改动 App 或 Figma。</p></dialog><input type="file" id="import-file" accept=".json,application/json" hidden>
<script src="design-data.js"></script><script src="renderer.js"></script><script src="app.js"></script></body></html>
